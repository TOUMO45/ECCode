name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  toolkit:
    name: toolkit (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['18.17', '20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade/rollback test installs the 0.1.0 release from history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Identify git for tests that commit
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "ci"
      - name: Static validation and test suite (also replays every shipped record)
        run: npm run check

  toolkit-windows:
    # The engine is portable. The five failures of the independent review's
    # Windows run were in the suite, not the engine: fixtures that needed sh,
    # grep, true/false or ";" (cmd.exe has none of them), POSIX-only argument
    # quoting in `evidence run -- ...`, and test repos whose checkouts rewrote
    # LF as CRLF under the runner's global core.autocrlf=true, so pinned byte
    # hashes no longer matched. Fixed by portable `node -e` fixtures, a win32
    # branch in shellQuote, core.autocrlf=false in every test repo and
    # .gitattributes (eol=lf). Reported but not gating until this job has
    # passed on the runner; then drop continue-on-error.
    name: toolkit (windows, node 22, not gating yet)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: git config --global user.email "ci@example.invalid" && git config --global user.name "ci"
      - run: npm run check

  groundwork:
    name: examples/groundwork (ubuntu, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic suite (no network, no model)
        working-directory: examples/groundwork
        run: npm test
      - name: Records still audit after the suite ran
        run: |
          node bin/eccode.js --root examples/groundwork audit
          node bin/eccode.js --root examples/triage-desk audit
