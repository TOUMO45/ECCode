[project]
name = "ledger"
version = "0.1.0"
description = "ECCode Phase 3 fixture: a small FastAPI + SQLAlchemy + Alembic ledger service with seeded flaws"
requires-python = ">=3.10"
dependencies = ["fastapi", "httpx", "sqlalchemy>=2", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
